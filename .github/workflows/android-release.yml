# Builds the Android app (APK) with EAS and publishes it as a GitHub Release.
#
# Runs by itself whenever app changes (apps/mobile) are pushed to main: the version is the
# latest release plus one patch (1.0.2 -> 1.0.3), or app.json's version if that is higher
# (raise it there for a bigger jump such as 1.1.0). Put [skip release] in the commit message
# to push app changes without releasing.
#
# A specific version can also be released by pushing a tag
# (git tag -a v1.0.2 -m "What changed, for users" && git push origin v1.0.2) or from the
# Actions tab. Release notes come from the tag message, the Actions-tab box, or the commit
# messages, and are shown to people in the app's update prompt.
#
# The version is set when building, so app.json does not need editing. Once the release is
# published, the API (GET /api/v1/app/latest), the landing page download button and the
# in-app update prompt pick it up within about 5 minutes.
#
# Needs one repository secret: EXPO_TOKEN (an Expo access token for the oyinlola141 account).
name: Android release

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '!apps/mobile/**/*.md'
      - '!apps/mobile/docs/**'
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.0.2 (creates the tag v1.0.2)'
        required: true
      notes:
        description: 'What changed, shown to users in the update prompt'
        required: false

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  # Builds on EAS. The free EAS queue can take over an hour, so publishing is a separate job
  # that starts afterwards with a fresh GitHub token (a long-waiting job's token can stop working).
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      previous: ${{ steps.version.outputs.previous }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags, to find the previous release and write notes from commits
          fetch-depth: 0
          fetch-tags: true

      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          semver='^[0-9]+\.[0-9]+\.[0-9]+$'
          # Highest existing release tag (v1.2.3), if any
          latest=$(git tag -l 'v*.*.*' | sed 's/^v//' | grep -E "$semver" | sort -V | tail -n1)
          if [ -n "$INPUT_VERSION" ]; then
            version="${INPUT_VERSION#v}"
          elif [ "$REF_TYPE" = "tag" ]; then
            version="${REF_NAME#v}"
          else
            # Automatic release: next patch after the latest release, or app.json if higher
            configured=$(node -p 'require("./app.json").expo.version')
            if [ -n "$latest" ]; then
              IFS=. read -r major minor patch <<< "$latest"
              next="$major.$minor.$((patch + 1))"
            else
              next="$configured"
            fi
            version=$(printf '%s\n%s\n' "$next" "$configured" | sort -V | tail -n1)
          fi
          echo "previous=$latest" >> "$GITHUB_OUTPUT"
          if ! [[ "$version" =~ $semver ]]; then
            echo "::error::'$version' is not a version like 1.0.2"
            exit 1
          fi
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "::error::Release v$version already exists"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
        shell: bash

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set the app version to ${{ steps.version.outputs.version }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const config = JSON.parse(fs.readFileSync("app.json", "utf8"));
            config.expo.version = process.env.VERSION;
            fs.writeFileSync("app.json", JSON.stringify(config, null, 2) + "\n");
          '

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build the APK on EAS
        run: |
          eas build --platform android --profile preview --non-interactive --wait --json > build.json
          url=$(node -e 'const b = JSON.parse(require("fs").readFileSync("build.json", "utf8")); const build = Array.isArray(b) ? b[0] : b; console.log(build.artifacts?.buildUrl ?? build.artifacts?.applicationArchiveUrl ?? "")')
          if [ -z "$url" ]; then
            echo "::error::EAS did not return an APK download link"
            cat build.json
            exit 1
          fi
          curl -fsSL "$url" -o "PowerWatch-${{ steps.version.outputs.version }}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: apps/mobile/PowerWatch-${{ steps.version.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v8
        with:
          name: apk
          path: apps/mobile

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PREVIOUS: ${{ needs.build.outputs.previous }}
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          # Notes: the Actions-tab box, else the annotated tag's message, else the app's commit
          # subjects since the last release (without "feat(mobile):" style prefixes), else a default
          notes="$INPUT_NOTES"
          if [ -z "$notes" ] && [ "$(git cat-file -t "v$VERSION" 2>/dev/null)" = "tag" ]; then
            notes=$(git tag -l --format='%(contents)' "v$VERSION")
          fi
          if [ -z "$notes" ]; then
            range="${PREVIOUS:+v$PREVIOUS..}HEAD"
            notes=$(git log --no-merges --format='%s' $range -- . \
              | grep -viE '^(docs|chore|test|ci|build|style)(\(|:)|\[skip release\]' \
              | sed -E 's/^[a-z]+(\([^)]*\))?!?: *//' \
              | awk 'NF { print "- " toupper(substr($0,1,1)) substr($0,2) }' \
              | head -n 8)
          fi
          notes="${notes:-Improvements and fixes.}"
          gh release create "v$VERSION" "PowerWatch-$VERSION.apk" \
            --title "PowerWatch $VERSION" \
            --notes "$notes" \
            --target "$GITHUB_SHA"
